# Illustrative GitLab CI configuration.
# Adapt image, cache keys, and scripts to the project stack.
# Prefer digest-pinned images and versioned includes in production.

stages:
  - validate
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true
  timeout: 15m

variables:
  # Prefer lockfile-driven installs in scripts
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key:
    files:
      - uv.lock          # or package-lock.json / pnpm-lock.yaml / go.sum
  paths:
    - .cache/

lint:
  stage: validate
  image: python:3.12-slim  # prefer digest in real use
  script:
    - echo "lint command here"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  image: python:3.12-slim
  script:
    - echo "test command here"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: python:3.12-slim
  script:
    - echo "build immutable artifact here"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
