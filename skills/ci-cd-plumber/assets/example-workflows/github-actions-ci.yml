      # - name: Install uv
      #   uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      # - name: Sync deps (locked)
      #   run: uv sync --locked --all-extras
      #
      # Example: Node + pnpm
      # - name: Setup Node
      #   uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      #   with:
      #     node-version: "22"
      #     cache: "pnpm"
      # - run: pnpm install --frozen-lockfile

      - name: Lint
        run: echo "lint command here"

      - name: Unit tests
        run: echo "test command here"

      # Optional: lightweight SAST / secret scan as advisory or blocking
      # per maturity posture in the baseline.
