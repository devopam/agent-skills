# Illustrative GitHub Actions CI workflow (PR + main).
# Adapt language/runtime setup, test commands, and cache keys to the project.
# Pin every third-party action to a full commit SHA (update SHAs before use).

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at workflow level; elevate only in jobs that need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # --- Language setup (replace with project stack) ---
